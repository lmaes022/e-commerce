<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Sun Chips - Contact</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
        <link rel="stylesheet" href="style.css" type="text/css" />
        <script src="script.js"></script>
        <style>
            .header {
                margin-bottom: 0;
            }
        </style>
    </head>
    <body>
        <nav>
            <div class="logoCont">
                <a href="index"><img src="images/SunChips-Logo.png" style="height:60px;object-fit:contain;"></a>
            </div>
            <ul class="linkCont">
                <li><a href="index">Home</a></li>
                <li><a href="products">Products</a></li>
                <li><a href="contact">Contact</a></li>
            </ul>
        </nav>
        <div id="container">
            <div class="header">
                <aside>
                    <h1>Contact Us<br><sup>We're always open to feedback!</sup></h1>
                </aside>
            </div>
            <form class="contact">
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email Address" required>
                <textarea rows="5" placeholder="Your Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
        <footer class="pad">This site is not affiliated with Frito-Lay or Pepsi-Co.</footer>
    </body>
</html>
